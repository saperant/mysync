[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mysync"
version = "0.9.0"
description = "Two-way folder synchronization (local, SFTP, SSH, rclone remotes) in the myrcp workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saku Rantamäki" }]
dependencies = [
    "paramiko>=3.4",
    "myrcp>=0.9.1",  # the user interface: the myrcp workbench, from PyPI
]

[project.optional-dependencies]
# pyte reads the workbench's screen in the tests that run it in a terminal.
test = ["pytest>=8", "pyte>=0.8"]

[project.scripts]
mysync = "mysync.cli:main"

[project.urls]
Homepage = "https://github.com/saperant/mysync"
Issues = "https://github.com/saperant/mysync/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The myrcp product: its manifest and the plugin, which the plugin host imports from
# its directory (not as mysync's own subpackage).
[tool.setuptools.package-data]
"mysync.ui" = ["product.toml", "plugins/*/myrcp.toml", "plugins/*/*/*.py"]
