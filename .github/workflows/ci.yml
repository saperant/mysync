name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The current release from rclone.org: Ubuntu's 1.60 cannot serve its rc API on a
      # unix socket, and mysync's checksums need operations/hashsumfile.
      - name: rclone (its backend's tests)
        run: |
          curl -fsSLo "$RUNNER_TEMP/rclone.zip" https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j "$RUNNER_TEMP/rclone.zip" "*/rclone" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rclone" version | head -1
      # mysync depends on the myrcp wheel from PyPI: the workbench and its plugin SDK.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e '.[test]'
      - name: Test
        run: .venv/bin/pytest -q -rs
      - name: The workbench starts (headless)
        run: XDG_STATE_HOME=$RUNNER_TEMP MYSYNC_CONFIG_DIR=$RUNNER_TEMP/conf .venv/bin/mysync ui -- --list

  release:
    # A tag v*: the wheel and the sdist attached to a GitHub release of that tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: pipx run build
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
